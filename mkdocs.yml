site_name: Лабораторная работа — Python SSG
site_description: Исследование генераторов статических сайтов на Python и CI/CD
site_author: Искандар Гарифуллин
site_url: https://iskandario.github.io/python-ssg-lab/
repo_url: https://github.com/iskandario/python-ssg-lab
repo_name: iskandario/python-ssg-lab
use_directory_urls: true

theme:
  name: mkdocs
  language: ru

nav:
  - Главная: index.md
  - Эксперимент: experiment.md
  - Исследование SSG: research.md
  - CI/CD и развёртывание: deployment.md
  - Проверка результата: verification.md
  - Лицензии: licenses.md

plugins:
  - search:
      lang: ru

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - md_in_html

extra_css:
  - assets/extra.css

copyright: >-
  Контент: CC BY 4.0. Код: MIT.
