name: Deploy Sphinx research site to Helios

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build in strict mode
        run: sphinx-build -W --keep-going -b html docs site
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          HELIOS_HOST: ${{ secrets.HELIOS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HELIOS_HOST" >> ~/.ssh/known_hosts
      - name: Upload static site
        env:
          HELIOS_HOST: ${{ secrets.HELIOS_HOST }}
          HELIOS_USER: ${{ secrets.HELIOS_USER }}
          HELIOS_PATH: ${{ secrets.HELIOS_PATH }}
        run: rsync -az --delete site/ "${HELIOS_USER}@${HELIOS_HOST}:${HELIOS_PATH}/"
